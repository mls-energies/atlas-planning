<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173947"><title>Atlas Planning</title>
<style>
:root{--ink:#173947;--red:#d71920;--green:#1b7a50;--bg:#f2f6f7;--line:#dbe4e7;--muted:#6c7b82}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px}
.head{max-width:850px;margin:auto;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:19px}.head small{color:var(--muted)}
main{max-width:850px;margin:auto;padding:14px 12px 100px}.hero{background:linear-gradient(135deg,var(--ink),#2c5b6d);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}.hero h2{margin:4px 0}.hero p{margin:0;opacity:.82}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px}.tab{border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;font-weight:800}.tab.active{background:var(--ink);color:#fff}
.screen{display:none}.screen.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}
.dayhead{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:9px}.dayhead h3{margin:0;font-size:16px}.date{font-size:12px;color:var(--muted)}
.job{border-left:5px solid var(--green);background:#f7faf9;border-radius:10px;padding:11px;margin:9px 0}.job.done{opacity:.5;text-decoration:line-through}.job h4{margin:0 0 5px}.address{font-size:13px;color:var(--muted);margin-bottom:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;font-weight:800;color:var(--ink);text-decoration:none}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.btn.donebtn{background:#e5f4ec;color:#126641}
.site{border-bottom:1px solid var(--line);padding:11px 0}.site:last-child{border:0}.site h4{margin:0 0 4px}.site p{margin:0 0 8px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:800;margin:9px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:11px 14px;display:flex;justify-content:center}.bottom button{width:100%;max-width:520px;border:0;border-radius:12px;background:var(--red);color:#fff;padding:14px;font-weight:900}
@media(max-width:600px){.tabs,.grid2{grid-template-columns:1fr}.actions .btn{flex:1;text-align:center}}
</style></head><body>
<header><div class="head"><div><h1>ATLAS PLANNING</h1><small>MLS Énergies — tournée Funecap</small></div><strong>V0.1 terrain</strong></div></header>
<main>
<div class="hero"><small>Demain matin</small><h2>Tu ouvres, tu regardes, tu pars.</h2><p>Planning préchargé, adresses et itinéraires.</p></div>
<div class="tabs"><button class="tab active" data-tab="planning">Planning</button><button class="tab" data-tab="sites">Sites</button><button class="tab" data-tab="add">Ajouter</button></div>
<section id="planning" class="screen active"><div id="planningList"></div></section>
<section id="sites" class="screen"><div class="card"><h3>Sites Funecap</h3><div id="siteList"></div></div></section>
<section id="add" class="screen"><div class="card"><h3>Ajouter un rendez-vous</h3>
<div class="grid2"><div><label>Type</label><select id="newType"><option>Devis</option><option>Dépannage</option><option>Maintenance</option><option>Installation</option></select></div><div><label>Date</label><input id="newDate" type="date"></div></div>
<label>Nom / client</label><input id="newName" placeholder="Ex. Salon de coiffure">
<label>Adresse</label><input id="newAddress" placeholder="Adresse complète">
<label>Créneau</label><input id="newSlot" placeholder="Ex. 16h30">
<button class="btn primary" id="addBtn" style="margin-top:12px;width:100%">Ajouter au planning</button>
</div></section>
</main><div class="bottom"><button id="todayBtn">Voir la prochaine intervention</button></div>
<script>
const BASE={"Maison Comba Cuers": "39 rue du Souvenir Français, 83390 Cuers", "Maison Femenia Toulon": "Rue Nicolas Appert, 83100 Toulon", "Maison Comba La Crau": "7 rue Renaude, 83260 La Crau", "Maison Comba La Farlède": "122 rue de la République, 83210 La Farlède", "Maison Comba La Londe": "8 rue Maréchal Foch, 83250 La Londe-les-Maures", "Maison Comba Bormes": "28 boulevard du Levant, 83230 Bormes-les-Mimosas", "Direction administrative Grand Var": "1110 chemin des Plantades, Centre d'affaires Grand Var, 83130 La Garde", "PF Mistre La Garde": "28 rue J.-B. Lavène, 83130 La Garde", "Pascal Leclerc La Seyne": "2 rue Docteur Mazen, 83500 La Seyne-sur-Mer", "PF Mistre Le Clos": "1 le Clos du Haut, 83190 Ollioules", "Athanée de Sanary": "960 chemin de l'Huide, 83110 Sanary-sur-Mer", "PF Mistre Sanary": "11 rue Félix Pijeaud, 83110 Sanary-sur-Mer", "Marbrerie Varoise": "410 rue Henri Sainte-Claire Deville, 83100 Toulon", "ROC-Eclerc Hyères": "7 rue Docteur Roux Seignoret, 83400 Hyères", "ROC-Eclerc Six-Fours": "59 avenue de la Mer, 83140 Six-Fours-les-Plages", "ROC-Eclerc Aristide-Briand": "1379 avenue Aristide Briand, 83200 Toulon", "ROC-Eclerc Colonel Picot": "310 avenue Colonel Picot, 83100 Toulon", "ROC-Eclerc Maréchal-Bugeaud": "1 avenue Maréchal Bugeaud + 137 rue du 15e Corps, 83200 Toulon", "ROC-Eclerc Boulevard Sainte-Anne": "Angle boulevard Sainte-Anne, 83000 Toulon", "ROC-Eclerc Sainte-Anne": "65 boulevard Sainte-Anne, 83000 Toulon", "Pascal Leclerc Deville": "366 rue Henri Sainte-Claire Deville, 83100 Toulon", "Bureaux administratifs": "410 rue Henri Sainte-Claire Deville, 83100 Toulon", "Dépôt logistique": "410 rue Henri Sainte-Claire Deville, 83100 Toulon", "ROC-Eclerc Docteur Trémolières": "180 avenue du Docteur Trémolières, 83160 La Valette-du-Var", "ROC-Eclerc Le Castellet": "218 rue des Micocouliers, 83330 Le Castellet", "Maison Comba Le Lavandou": "Adresse à compléter, Le Lavandou", "Maison Femenia Sainte-Musse": "Adresse à compléter, Toulon Sainte-Musse", "Rendez-vous devis salon de coiffure": "Adresse à compléter"};
const DEFAULT_PLAN=[["2026-07-27", "Lundi après-midi", ["Maison Comba Cuers", "Maison Comba La Crau"]], ["2026-07-28", "Mardi après-midi", ["Maison Comba La Farlède", "ROC-Eclerc Docteur Trémolières", "Rendez-vous devis salon de coiffure"]], ["2026-07-29", "Mercredi après-midi", ["ROC-Eclerc Hyères", "Maison Comba La Londe"]], ["2026-07-30", "Jeudi après-midi", ["Maison Comba Bormes", "Maison Comba Le Lavandou"]], ["2026-07-31", "Vendredi après-midi", ["PF Mistre Sanary", "ROC-Eclerc Le Castellet"]], ["2026-08-01", "Samedi matin", ["PF Mistre Le Clos", "ROC-Eclerc Six-Fours"]], ["2026-08-03", "Lundi après-midi", ["Pascal Leclerc La Seyne", "ROC-Eclerc Aristide-Briand"]], ["2026-08-04", "Mardi après-midi", ["Maison Femenia Sainte-Musse", "ROC-Eclerc Colonel Picot"]], ["2026-08-05", "Mercredi après-midi", ["ROC-Eclerc Maréchal-Bugeaud", "ROC-Eclerc Sainte-Anne"]], ["2026-08-06", "Jeudi après-midi", ["ROC-Eclerc Boulevard Sainte-Anne", "Pascal Leclerc Deville"]], ["2026-08-07", "Vendredi après-midi", ["Direction administrative Grand Var"]], ["2026-08-08", "Samedi journée", ["Marbrerie Varoise", "Bureaux administratifs", "Dépôt logistique"]]];
let extras=JSON.parse(localStorage.getItem('atlas-planning-extras')||'[]');
let done=JSON.parse(localStorage.getItem('atlas-planning-done')||'{}');
let deleted=JSON.parse(localStorage.getItem('atlas-planning-deleted')||'{}');
const $=id=>document.getElementById(id);
$('newDate').value=new Date().toISOString().slice(0,10);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
function maps(address){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address)}
function allPlan(){const p=DEFAULT_PLAN.map(x=>({date:x[0],label:x[1],jobs:x[2].map(n=>({name:n,address:BASE[n]||'Adresse à compléter'}))}));extras.forEach(e=>{let d=p.find(x=>x.date===e.date);if(!d){d={date:e.date,label:e.date,jobs:[]};p.push(d)}d.jobs.push({name:e.type+' — '+e.name,address:e.address,slot:e.slot,extraId:e.id})});return p.sort((a,b)=>a.date.localeCompare(b.date))}
function renderPlan(){
 const box=$('planningList');box.innerHTML='';
 allPlan().forEach(day=>{
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="dayhead"><div><h3>${day.label}</h3><div class="date">${new Date(day.date+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div></div><strong>${day.jobs.length} arrêt(s)</strong></div>`;
  day.jobs.forEach((j,i)=>{
   const key=day.date+'-'+i+'-'+j.name;
   if(deleted[key]) return;
   const el=document.createElement('div');
   el.className='job'+(done[key]?' done':'');
   el.innerHTML=`<h4>${j.slot?j.slot+' · ':''}${j.name}</h4><div class="address">${j.address}</div><div class="actions"><a class="btn primary" target="_blank" href="${maps(j.address)}">📍 Itinéraire</a><a class="btn" href="https://atlas-mls.vercel.app" target="_blank">🔧 Maintenance</a><button class="btn donebtn" data-key="${encodeURIComponent(key)}">${done[key]?'Réouvrir':'✅ Terminé'}</button><button class="btn" data-delete="${encodeURIComponent(key)}" data-extra="${j.extraId||''}">🗑️ Supprimer</button></div>`;
   card.appendChild(el)
  });
  box.appendChild(card)
 });
 box.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{
  const k=decodeURIComponent(b.dataset.key);done[k]=!done[k];
  localStorage.setItem('atlas-planning-done',JSON.stringify(done));renderPlan()
 });
 box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{
  if(!confirm('Supprimer ce rendez-vous du planning ?'))return;
  const k=decodeURIComponent(b.dataset.delete),extraId=Number(b.dataset.extra||0);
  if(extraId){
   extras=extras.filter(e=>e.id!==extraId);
   localStorage.setItem('atlas-planning-extras',JSON.stringify(extras))
  }else{
   deleted[k]=true;
   localStorage.setItem('atlas-planning-deleted',JSON.stringify(deleted))
  }
  delete done[k];localStorage.setItem('atlas-planning-done',JSON.stringify(done));renderPlan()
 })
}
function renderSites(){const box=$('siteList');box.innerHTML='';Object.entries(BASE).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([n,a])=>{const d=document.createElement('div');d.className='site';d.innerHTML=`<h4>${n}</h4><p>${a}</p><a class="btn primary" target="_blank" href="${maps(a)}">📍 Itinéraire</a>`;box.appendChild(d)})}
$('addBtn').onclick=()=>{if(!$('newName').value.trim()||!$('newDate').value)return alert('Renseigne au moins le nom et la date.');extras.push({id:Date.now(),type:$('newType').value,name:$('newName').value.trim(),date:$('newDate').value,address:$('newAddress').value.trim()||'Adresse à compléter',slot:$('newSlot').value.trim()});localStorage.setItem('atlas-planning-extras',JSON.stringify(extras));$('newName').value='';$('newAddress').value='';$('newSlot').value='';renderPlan();document.querySelector('[data-tab="planning"]').click()}
$('todayBtn').onclick=()=>{document.querySelector('[data-tab="planning"]').click();const today=new Date().toISOString().slice(0,10);const cards=[...document.querySelectorAll('#planningList .card')];const target=cards.find(c=>c.textContent.includes(new Date(today+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'})))||cards[0];if(target)target.scrollIntoView({behavior:'smooth'})}
renderPlan();renderSites();
</script></body></html>
