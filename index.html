<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a3a"><meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Atlas by MLS Énergies — application métier de planification terrain">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<title>ATLAS by MLS Énergies</title>
<style>
:root{--navy-950:#081e2c;--navy-900:#102a3a;--navy-800:#173b50;--navy-700:#24536b;--blue-100:#e9f3f7;--blue-50:#f4f8fa;--accent:#e04b3f;--accent-dark:#c9362d;--green:#1d805c;--green-soft:#eaf6f1;--white:#fff;--bg:#eef3f5;--line:#d7e1e5;--line-strong:#c4d1d7;--text:#142d3b;--muted:#667b86;--shadow:0 8px 28px rgba(8,30,44,.08);--shadow-sm:0 2px 9px rgba(8,30,44,.06);--radius:16px;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(8,30,44,.02);backdrop-filter:blur(14px)}
.head{max-width:980px;min-height:72px;margin:auto;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;min-width:0}.brand img{display:block;width:202px;max-width:100%;height:auto}.version{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.02em}.version::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
main{max-width:980px;margin:auto;padding:22px 18px 126px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy-950),var(--navy-700));color:#fff;border-radius:22px;padding:28px 30px;margin-bottom:18px;box-shadow:var(--shadow)}.hero::after{content:"A";position:absolute;right:24px;top:-42px;color:rgba(255,255,255,.055);font-size:190px;font-weight:900;line-height:1}.hero small{position:relative;z-index:1;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:#a9cad8}.hero h2{position:relative;z-index:1;margin:5px 0 4px;font-size:26px;line-height:1.2;letter-spacing:-.025em}.hero p{position:relative;z-index:1;margin:0;color:#d5e4ea}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;padding:5px;background:#dfe8eb;border:1px solid #d5e0e4;border-radius:14px}.tab{appearance:none;border:0;border-radius:10px;background:transparent;padding:11px 14px;color:var(--muted);font-weight:750;cursor:pointer;transition:.18s ease}.tab:hover{color:var(--navy-900);background:rgba(255,255,255,.48)}.tab.active{background:var(--white);color:var(--navy-900);box-shadow:var(--shadow-sm)}
.screen{display:none}.screen.active{display:block}.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}.card>h3{margin:0 0 16px;font-size:18px;letter-spacing:-.015em}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:13px}.dayhead h3{margin:0;font-size:17px;letter-spacing:-.01em}.dayhead strong{padding:5px 9px;border-radius:999px;background:var(--blue-100);color:var(--navy-700);font-size:11px;white-space:nowrap}.date{margin-top:2px;font-size:12px;color:var(--muted);text-transform:capitalize}
.job{border:1px solid #dce8e3;border-left:4px solid var(--green);background:#f8fbfa;border-radius:12px;padding:13px 14px;margin:10px 0}.job.done{opacity:.52;text-decoration:line-through}.job h4{margin:0 0 4px;font-size:15px}.address{font-size:13px;color:var(--muted);margin-bottom:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:38px;border:1px solid var(--line-strong);background:var(--white);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:750;color:var(--navy-900);text-decoration:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);background:var(--blue-50)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{background:var(--accent-dark)}.btn.donebtn{background:var(--green-soft);border-color:#cfe8dd;color:#146847}
.site{border-bottom:1px solid var(--line);padding:14px 2px}.site:last-child{border:0;padding-bottom:2px}.site:first-child{padding-top:2px}.site h4{margin:0 0 3px;font-size:15px}.site p{margin:0 0 10px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:750;color:var(--navy-800);margin:12px 0 6px}input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:#fff;color:var(--text);font-size:14px;outline:0;transition:border-color .15s ease,box-shadow .15s ease}input:focus,select:focus,textarea:focus{border-color:var(--navy-700);box-shadow:0 0 0 3px rgba(36,83,107,.12)}input::placeholder{color:#91a0a7}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;backdrop-filter:blur(14px)}.bottom::before{content:"ATLAS • MLS ÉNERGIES";position:absolute;left:max(18px,calc((100vw - 944px)/2));top:50%;transform:translateY(-50%);color:#8a9aa2;font-size:10px;font-weight:800;letter-spacing:.1em}.bottom button{width:100%;max-width:470px;border:0;border-radius:11px;background:var(--accent);color:#fff;padding:13px 18px;font-weight:800;cursor:pointer;box-shadow:0 5px 15px rgba(224,75,63,.22);transition:.15s ease}.bottom button:hover{background:var(--accent-dark);transform:translateY(-1px)}
@media(max-width:760px){.bottom::before{display:none}}@media(max-width:600px){.head{min-height:64px;padding:9px 14px}.brand img{width:174px}.version{font-size:0}.version::before{width:9px;height:9px}.version::after{content:"Terrain";font-size:11px}.head{gap:10px}main{padding:14px 12px 116px}.hero{padding:22px 19px;border-radius:17px;margin-bottom:12px}.hero::after{right:-18px;font-size:160px}.hero h2{font-size:21px;max-width:85%}.hero p{font-size:13px;max-width:86%}.tabs{gap:4px;margin-bottom:12px}.tab{padding:10px 7px;font-size:13px}.card{padding:14px;border-radius:13px;margin-bottom:10px}.grid2{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%;text-align:center}.dayhead{gap:8px}.bottom{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.bottom button{max-width:none}.site .btn{width:100%}}@media(max-width:370px){.actions{grid-template-columns:1fr}.hero h2{font-size:19px}.tab{font-size:12px}}
</style></head><body>
<header><div class="head"><div class="brand"><img src="logo-atlas.svg" alt="ATLAS by MLS Énergies"></div><div class="version">V0.1 terrain</div></div></header>
<main>
<div class="hero"><small>Demain matin</small><h2>Tu ouvres, tu regardes, tu pars.</h2><p>Planning préchargé, adresses et itinéraires.</p></div>
<div class="tabs"><button class="tab active" data-tab="planning">Planning</button><button class="tab" data-tab="sites">Sites</button><button class="tab" data-tab="add">Ajouter</button></div>
<section id="planning" class="screen active"><div id="planningList"></div></section>
<section id="sites" class="screen"><div class="card"><h3>Sites Funecap</h3><div id="siteList"></div></div></section>
<section id="add" class="screen"><div class="card"><h3>Ajouter un rendez-vous</h3>
<div class="grid2"><div><label>Type</label><select id="newType"><option>Devis</option><option>Dépannage</option><option>Maintenance</option><option>Installation</option></select></div><div><label>Date</label><input id="newDate" type="date"></div></div>
<label>Nom / client</label><input id="newName" placeholder="Ex. Salon de coiffure">
<label>Adresse</label><input id="newAddress" placeholder="Adresse complète">
<label>Créneau</label><input id="newSlot" placeholder="Ex. 16h30">
<button class="btn primary" id="addBtn" style="margin-top:12px;width:100%">Ajouter au planning</button>
</div></section>
</main><div class="bottom"><button id="todayBtn">Voir la prochaine intervention</button></div>
<script>
const BASE={"Maison Comba Cuers": "39 rue du Souvenir Français, 83390 Cuers", "Maison Femenia Toulon": "Rue Nicolas Appert, 83100 Toulon", "Maison Comba La Crau": "7 rue Renaude, 83260 La Crau", "Maison Comba La Farlède": "122 rue de la République, 83210 La Farlède", "Maison Comba La Londe": "8 rue Maréchal Foch, 83250 La Londe-les-Maures", "Maison Comba Bormes": "28 boulevard du Levant, 83230 Bormes-les-Mimosas", "Direction administrative Grand Var": "1110 chemin des Plantades, Centre d'affaires Grand Var, 83130 La Garde", "PF Mistre La Garde": "28 rue J.-B. Lavène, 83130 La Garde", "Pascal Leclerc La Seyne": "2 rue Docteur Mazen, 83500 La Seyne-sur-Mer", "PF Mistre Le Clos": "1 le Clos du Haut, 83190 Ollioules", "Athanée de Sanary": "960 chemin de l'Huide, 83110 Sanary-sur-Mer", "PF Mistre Sanary": "11 rue Félix Pijeaud, 83110 Sanary-sur-Mer", "Marbrerie Varoise": "410 rue Henri Sainte-Claire Deville, 83100 Toulon", "ROC-Eclerc Hyères": "7 rue Docteur Roux Seignoret, 83400 Hyères", "ROC-Eclerc Six-Fours": "59 avenue de la Mer, 83140 Six-Fours-les-Plages", "ROC-Eclerc Aristide-Briand": "1379 avenue Aristide Briand, 83200 Toulon", "ROC-Eclerc Colonel Picot": "310 avenue Colonel Picot, 83100 Toulon", "ROC-Eclerc Maréchal-Bugeaud": "1 avenue Maréchal Bugeaud + 137 rue du 15e Corps, 83200 Toulon", "ROC-Eclerc Boulevard Sainte-Anne": "Angle boulevard Sainte-Anne, 83000 Toulon", "ROC-Eclerc Sainte-Anne": "65 boulevard Sainte-Anne, 83000 Toulon", "Pascal Leclerc Deville": "366 rue Henri Sainte-Claire Deville, 83100 Toulon", "Bureaux administratifs": "410 rue Henri Sainte-Claire Deville, 83100 Toulon", "Dépôt logistique": "410 rue Henri Sainte-Claire Deville, 83100 Toulon", "ROC-Eclerc Docteur Trémolières": "180 avenue du Docteur Trémolières, 83160 La Valette-du-Var", "ROC-Eclerc Le Castellet": "218 rue des Micocouliers, 83330 Le Castellet", "Maison Comba Le Lavandou": "Adresse à compléter, Le Lavandou", "Maison Femenia Sainte-Musse": "Adresse à compléter, Toulon Sainte-Musse", "Rendez-vous devis salon de coiffure": "Adresse à compléter"};
const DEFAULT_PLAN=[["2026-07-27", "Lundi après-midi", ["Maison Comba Cuers", "Maison Comba La Crau"]], ["2026-07-28", "Mardi après-midi", ["Maison Comba La Farlède", "ROC-Eclerc Docteur Trémolières", "Rendez-vous devis salon de coiffure"]], ["2026-07-29", "Mercredi après-midi", ["ROC-Eclerc Hyères", "Maison Comba La Londe"]], ["2026-07-30", "Jeudi après-midi", ["Maison Comba Bormes", "Maison Comba Le Lavandou"]], ["2026-07-31", "Vendredi après-midi", ["PF Mistre Sanary", "ROC-Eclerc Le Castellet"]], ["2026-08-01", "Samedi matin", ["PF Mistre Le Clos", "ROC-Eclerc Six-Fours"]], ["2026-08-03", "Lundi après-midi", ["Pascal Leclerc La Seyne", "ROC-Eclerc Aristide-Briand"]], ["2026-08-04", "Mardi après-midi", ["Maison Femenia Sainte-Musse", "ROC-Eclerc Colonel Picot"]], ["2026-08-05", "Mercredi après-midi", ["ROC-Eclerc Maréchal-Bugeaud", "ROC-Eclerc Sainte-Anne"]], ["2026-08-06", "Jeudi après-midi", ["ROC-Eclerc Boulevard Sainte-Anne", "Pascal Leclerc Deville"]], ["2026-08-07", "Vendredi après-midi", ["Direction administrative Grand Var"]], ["2026-08-08", "Samedi journée", ["Marbrerie Varoise", "Bureaux administratifs", "Dépôt logistique"]]];
let extras=JSON.parse(localStorage.getItem('atlas-planning-extras')||'[]');
let done=JSON.parse(localStorage.getItem('atlas-planning-done')||'{}');
let deleted=JSON.parse(localStorage.getItem('atlas-planning-deleted')||'{}');
const $=id=>document.getElementById(id);
$('newDate').value=new Date().toISOString().slice(0,10);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
function maps(address){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address)}
function allPlan(){const p=DEFAULT_PLAN.map(x=>({date:x[0],label:x[1],jobs:x[2].map(n=>({name:n,address:BASE[n]||'Adresse à compléter'}))}));extras.forEach(e=>{let d=p.find(x=>x.date===e.date);if(!d){d={date:e.date,label:e.date,jobs:[]};p.push(d)}d.jobs.push({name:e.type+' — '+e.name,address:e.address,slot:e.slot,extraId:e.id})});return p.sort((a,b)=>a.date.localeCompare(b.date))}
function renderPlan(){
 const box=$('planningList');box.innerHTML='';
 allPlan().forEach(day=>{
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="dayhead"><div><h3>${day.label}</h3><div class="date">${new Date(day.date+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div></div><strong>${day.jobs.length} arrêt(s)</strong></div>`;
  day.jobs.forEach((j,i)=>{
   const key=day.date+'-'+i+'-'+j.name;
   if(deleted[key]) return;
   const el=document.createElement('div');
   el.className='job'+(done[key]?' done':'');
   el.innerHTML=`<h4>${j.slot?j.slot+' · ':''}${j.name}</h4><div class="address">${j.address}</div><div class="actions"><a class="btn primary" target="_blank" href="${maps(j.address)}">📍 Itinéraire</a><a class="btn" href="https://atlas-mls.vercel.app" target="_blank">🔧 Maintenance</a><button class="btn donebtn" data-key="${encodeURIComponent(key)}">${done[key]?'Réouvrir':'✅ Terminé'}</button><button class="btn" data-delete="${encodeURIComponent(key)}" data-extra="${j.extraId||''}">🗑️ Supprimer</button></div>`;
   card.appendChild(el)
  });
  box.appendChild(card)
 });
 box.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{
  const k=decodeURIComponent(b.dataset.key);done[k]=!done[k];
  localStorage.setItem('atlas-planning-done',JSON.stringify(done));renderPlan()
 });
 box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{
  if(!confirm('Supprimer ce rendez-vous du planning ?'))return;
  const k=decodeURIComponent(b.dataset.delete),extraId=Number(b.dataset.extra||0);
  if(extraId){
   extras=extras.filter(e=>e.id!==extraId);
   localStorage.setItem('atlas-planning-extras',JSON.stringify(extras))
  }else{
   deleted[k]=true;
   localStorage.setItem('atlas-planning-deleted',JSON.stringify(deleted))
  }
  delete done[k];localStorage.setItem('atlas-planning-done',JSON.stringify(done));renderPlan()
 })
}
function renderSites(){const box=$('siteList');box.innerHTML='';Object.entries(BASE).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([n,a])=>{const d=document.createElement('div');d.className='site';d.innerHTML=`<h4>${n}</h4><p>${a}</p><a class="btn primary" target="_blank" href="${maps(a)}">📍 Itinéraire</a>`;box.appendChild(d)})}
$('addBtn').onclick=()=>{if(!$('newName').value.trim()||!$('newDate').value)return alert('Renseigne au moins le nom et la date.');extras.push({id:Date.now(),type:$('newType').value,name:$('newName').value.trim(),date:$('newDate').value,address:$('newAddress').value.trim()||'Adresse à compléter',slot:$('newSlot').value.trim()});localStorage.setItem('atlas-planning-extras',JSON.stringify(extras));$('newName').value='';$('newAddress').value='';$('newSlot').value='';renderPlan();document.querySelector('[data-tab="planning"]').click()}
$('todayBtn').onclick=()=>{document.querySelector('[data-tab="planning"]').click();const today=new Date().toISOString().slice(0,10);const cards=[...document.querySelectorAll('#planningList .card')];const target=cards.find(c=>c.textContent.includes(new Date(today+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'})))||cards[0];if(target)target.scrollIntoView({behavior:'smooth'})}
renderPlan();renderSites();
</script></body></html>
